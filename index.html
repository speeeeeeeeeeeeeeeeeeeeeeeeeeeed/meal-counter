<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d6b4f">
<title>식사 인원 카운터</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--sub:#6b6a66;--line:#e2e0d9;--ac:#1d6b4f;--acx:#fff;--warn:#b4531a}
@media (prefers-color-scheme:dark){:root{--bg:#161715;--card:#222320;--tx:#efeee9;--sub:#a3a199;--line:#34352f;--ac:#4cc29a;--acx:#10231b;--warn:#f0a06b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px}
main{max-width:560px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 0;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.big{font-size:44px;font-weight:700;line-height:1}
.sub{color:var(--sub);font-size:14px}
button.main{width:100%;padding:16px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font-size:18px;font-weight:600}
button.ghost{width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;margin:6px 0}
#result{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 12px}
#result .ic{font-size:84px;line-height:1}
#result .idle{font-size:44px;font-weight:800;margin-top:18px;line-height:1.25}
#result .n{font-size:38px;font-weight:800;margin:10px 0}
#result .sub{font-size:20px}
.warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
td:last-child,th:last-child{text-align:right}
.hide{display:none}
.foot{text-align:center;margin-top:8px}
.foot a{color:var(--sub);font-size:13px;text-decoration:underline}
</style>
</head>
<body>
<main>
<nav id="tabs" class="hide">
<button data-t="scan" class="on">스캔</button><button data-t="today">오늘</button><button data-t="week">이번 주</button><button data-t="people">명단</button><button data-t="set">설정</button>
</nav>

<section id="scan">
<div class="card" id="result"></div>
<p class="sub" id="nfcmsg" style="text-align:center"></p>
<div class="card hide" id="reg">
<b>등록되지 않은 카드입니다</b>
<div class="sub" id="reguid"></div>
<input id="regname" placeholder="이름 입력" autocomplete="off">
<button class="main" id="regsave">등록하고 식사 기록</button>
</div>
</section>

<section id="today" class="hide"></section>
<section id="week" class="hide"></section>
<section id="people" class="hide"></section>

<section id="set" class="hide">
<div class="card">
<div><b>구글 시트 연결</b></div>
<div class="sub">웹앱 URL</div><input id="cfgurl" placeholder="https://script.google.com/macros/s/.../exec">
<div class="sub">비밀 키 (Code.gs의 KEY와 같은 값)</div><input id="cfgkey" placeholder="meal1234">
<button class="main" id="cfgsave">저장</button>
</div>
</section>

<p class="sub" id="status" style="text-align:center"></p>
<div class="foot">
<a href="#" id="adminlink">관리자</a>
<div id="adminbox" class="hide card" style="margin-top:10px;text-align:left">
<div class="sub">관리자 암호</div>
<input id="adminpw" type="password" autocomplete="off">
<button class="main" id="adminok">확인</button>
</div>
</div>
</main>

<script>
(function(){
var S={today:[],people:{},days:[],week:[]},tab="scan",pending=null,last={uid:"",t:0},ADMIN=null,rt=null;
var CFG={url:"",key:""};
try{CFG.url=localStorage.getItem("mc_url")||"";CFG.key=localStorage.getItem("mc_key")||"";ADMIN=sessionStorage.getItem("mc_admin")||null}catch(e){}
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function normUid(s){return String(s||"").replace(/[^0-9a-zA-Z]/g,"").toUpperCase()}
var DN=["월","화","수","목","금","토","일"];
var IDLE='<div class="ic">📲</div><div class="idle">카드를<br>대 주세요</div>';

function show(t){tab=t;["scan","today","week","people","set"].forEach(function(s){$(s).classList.toggle("hide",s!==t)});
document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===t)});
if(t==="today"||t==="week"||t==="people")refresh();render()}
$("tabs").addEventListener("click",function(e){var t=e.target.dataset&&e.target.dataset.t;if(t)show(t)});

function setResult(h,keep){$("result").innerHTML=h;clearTimeout(rt);if(!keep)rt=setTimeout(setIdle,4000)}
function setIdle(){$("result").innerHTML=IDLE;$("reg").classList.add("hide");pending=null}

async function api(o){
 if(!CFG.url){throw new Error("설정에서 구글 시트 주소를 먼저 입력해 주세요")}
 var r;
 if(o){o.key=CFG.key;if(ADMIN)o.admin=ADMIN;r=await fetch(CFG.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)})}
 else{r=await fetch(CFG.url+"?key="+encodeURIComponent(CFG.key)+"&admin="+encodeURIComponent(ADMIN||""))}
 var j=await r.json();
 if(j.error){throw new Error(j.error==="auth"?"비밀 키 또는 관리자 암호가 맞지 않습니다":j.error==="admin"?"관리자만 등록할 수 있습니다":j.error)}
 return j}
async function refresh(){if(!ADMIN)return;try{S=await api();$("status").textContent="";render()}catch(e){$("status").textContent="불러오기 실패: "+(e.message||e)}}

function showRes(j){
 $("reg").classList.add("hide");pending=null;
 if(j.status==="ok"){if(navigator.vibrate)navigator.vibrate(150);setResult('<div class="ic">✅</div><div class="n">'+esc(j.name)+'</div><div class="sub">식사 기록 완료 · 오늘 '+j.count+'번째</div>')}
 else if(j.status==="dup"){setResult('<div class="ic">⚠️</div><div class="n warn">'+esc(j.name)+'</div><div class="sub">오늘 이미 기록되었습니다 ('+esc(j.time)+')</div>')}
 else if(j.status==="unknown"){
  if(ADMIN){pending=j.uid;$("reguid").textContent="카드 번호: "+j.uid;$("regname").value="";$("reg").classList.remove("hide");setResult('<div class="ic">🆕</div><div class="n warn">미등록 카드</div><div class="sub">아래에 이름을 입력해 등록하세요</div>',true)}
  else{setResult('<div class="ic">🚫</div><div class="n warn">등록되지 않은 카드</div><div class="sub">관리자에게 문의해 주세요</div>')}
 }
}
async function handleCard(raw){
 var uid=normUid(raw);if(!uid)return;
 var now=Date.now();if(uid===last.uid&&now-last.t<3000)return;last={uid:uid,t:now};
 setResult('<div class="ic">⏳</div><div class="sub">확인 중…</div>',true);
 try{showRes(await api({action:"scan",uid:uid}))}catch(e){setResult('<div class="ic">❌</div><div class="n warn">저장 실패</div><div class="sub">'+esc(e.message||e)+'</div>')}
}
$("regsave").onclick=async function(){
 var n=$("regname").value.trim();if(!pending||!n)return;
 try{showRes(await api({action:"register",uid:pending,name:n}))}catch(e){setResult('<div class="ic">❌</div><div class="n warn">등록 실패</div><div class="sub">'+esc(e.message||e)+'</div>')}
};

var scanning=false,busy=false;
async function startScan(auto){
 if(scanning||busy)return;
 if(!("NDEFReader" in window)){$("nfcmsg").innerHTML='<span class="warn">이 브라우저는 NFC를 지원하지 않습니다.</span> 안드로이드 크롬에서 열어 주세요.';return}
 busy=true;
 try{
  var rd=new NDEFReader();await rd.scan();
  scanning=true;$("nfcmsg").textContent="";
  rd.onreading=function(ev){handleCard(ev.serialNumber)};
  rd.onreadingerror=function(){setResult('<div class="ic">❓</div><div class="n warn">읽지 못했습니다</div><div class="sub">다시 대 주세요</div>')};
 }catch(e){
  scanning=false;
  if(auto===true){$("nfcmsg").textContent="화면을 한 번 터치해 주세요"}
  else{$("nfcmsg").innerHTML='<span class="warn">시작 실패: '+esc(e&&e.name||"")+'</span> '+esc(e&&e.message||"")}
 }
 busy=false;
}
function autoStart(){
 if(scanning||!CFG.url)return;
 var hint=function(){$("nfcmsg").textContent="화면을 한 번 터치해 주세요"};
 try{navigator.permissions.query({name:"nfc"}).then(function(p){if(p.state==="granted")startScan(true);else hint()}).catch(hint)}catch(e){hint()}
}
document.addEventListener("click",function(){if(!scanning&&tab==="scan"&&CFG.url)startScan(true)});
document.addEventListener("visibilitychange",function(){if(!document.hidden){scanning=false;busy=false;autoStart()}});

function enterAdmin(){$("tabs").classList.remove("hide");$("adminbox").classList.add("hide");$("adminlink").textContent="관리자 모드 종료"}
function exitAdmin(){ADMIN=null;try{sessionStorage.removeItem("mc_admin")}catch(e){}$("tabs").classList.add("hide");$("adminlink").textContent="관리자";show("scan");setIdle()}
$("adminlink").onclick=function(e){e.preventDefault();if(ADMIN){exitAdmin()}else{$("adminbox").classList.toggle("hide");$("adminpw").focus()}};
$("adminok").onclick=async function(){
 var pw=$("adminpw").value;if(!pw)return;ADMIN=pw;
 try{S=await api();try{sessionStorage.setItem("mc_admin",pw)}catch(e){}$("adminpw").value="";$("status").textContent="";enterAdmin();show("scan")}
 catch(e){ADMIN=null;$("status").textContent="관리자 확인 실패: "+(e.message||e)}
};

function render(){
 if(tab==="today"){var l=S.today||[];
  $("today").innerHTML='<div class="card"><div class="sub">오늘 식사 인원</div><div class="big">'+l.length+'명</div></div><div class="card"><table><tr><th>이름</th><th>시각</th></tr>'+(l.map(function(m){return'<tr><td>'+esc(m.name)+'</td><td>'+esc(m.time)+'</td></tr>'}).join("")||'<tr><td class="sub" colspan="2">아직 없습니다</td></tr>')+'</table></div>'}
 if(tab==="week"){var days=S.days||[],wk=S.week||[],byP={};
  var rows=days.map(function(d,i){var c=wk.filter(function(m){return m.date===d});c.forEach(function(m){byP[m.name]=(byP[m.name]||0)+1});return'<tr><td>'+d.slice(5)+' ('+DN[i]+')</td><td>'+c.length+'명</td></tr>'}).join("");
  var pr=Object.keys(byP).sort(function(a,b){return byP[b]-byP[a]}).map(function(n){return'<tr><td>'+esc(n)+'</td><td>'+byP[n]+'회</td></tr>'}).join("");
  $("week").innerHTML='<div class="card"><div class="sub">'+(days[0]||"")+' ~ '+(days[6]||"")+' 식사 연인원</div><div class="big">'+wk.length+'명</div></div><div class="card"><table><tr><th>날짜</th><th>인원</th></tr>'+rows+'</table></div><div class="card"><table><tr><th>이름</th><th>횟수</th></tr>'+(pr||'<tr><td class="sub" colspan="2">기록 없음</td></tr>')+'</table></div><button class="ghost" id="csv">이번 주 기록 내려받기 (CSV)</button>';
  var b=$("csv");if(b)b.onclick=function(){var ls=["날짜,이름,시각"].concat(wk.map(function(m){return[m.date,m.name,m.time].join(",")}));
   var a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+ls.join("\n")],{type:"text/csv"}));a.download="meals_"+(days[0]||"week")+".csv";a.click()}}
 if(tab==="people"){var ks=Object.keys(S.people||{});
  $("people").innerHTML='<div class="card"><div class="sub" style="margin-bottom:6px">등록 인원 '+ks.length+'명</div><table><tr><th>이름</th><th>카드 번호</th></tr>'+(ks.map(function(k){return'<tr><td>'+esc(S.people[k])+'</td><td class="sub">'+esc(k)+'</td></tr>'}).join("")||'<tr><td class="sub" colspan="2">카드를 대면 이름을 등록할 수 있습니다</td></tr>')+'</table></div>'}
}

$("cfgurl").value=CFG.url;$("cfgkey").value=CFG.key;
$("cfgsave").onclick=function(){CFG.url=$("cfgurl").value.trim();CFG.key=$("cfgkey").value.trim();try{localStorage.setItem("mc_url",CFG.url);localStorage.setItem("mc_key",CFG.key)}catch(e){}$("status").textContent="저장했습니다.";show("scan");autoStart()};

setIdle();
if(ADMIN){enterAdmin()}
if(!CFG.url){show("set")}else{autoStart()}
})();
</script>
</body>
</html>
